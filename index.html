<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buvette — Fianchetto du Roi</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root { font-family: system-ui, sans-serif; color: #0a0a0a; background: #f4f4f2; }
      body { margin: 0; }
      header { background: #0a0a0a; color: #fff; padding: 14px 16px; display: flex; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
      .marque { display: flex; align-items: center; gap: 14px; }
      .marque svg { width: 52px; height: 52px; flex-shrink: 0; }
      .marque h1 { font-size: 20px; margin: 0; letter-spacing: 3px; font-weight: 800; text-transform: uppercase; }
      .marque .sous { font-size: 12px; color: #a3a3a3; margin: 2px 0 0; letter-spacing: 1px; }
      .bandeau { background: #0a0a0a; height: 6px;
        background-image: linear-gradient(45deg, transparent 25%, #FFD500 25% 50%, transparent 50% 75%, #FFD500 75%);
        background-size: 12px 12px; opacity: .95; }
      nav { display: flex; background: #0a0a0a; border-bottom: 3px solid #FFD500; }
      nav button { flex: 1; padding: 8px 4px 6px; font-size: 12px; font-weight: 700; border: none; background: none; color: #a3a3a3; cursor: pointer; letter-spacing: .5px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 0; }
      nav button.actif { color: #fff; background: #1c1c1c; box-shadow: inset 0 -4px 0 #FFD500; }
      nav button svg { width: 34px; height: 34px; }
      main { padding: 16px; max-width: 900px; margin: 0 auto; }
      .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
      .carre { aspect-ratio: 1; background: #fff; border: 2px solid #e5e5e5; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font: inherit; transition: transform .05s, border-color .1s; }
      .carre:active { transform: scale(.95); }
      .carre:hover:not(:disabled) { border-color: #FFD500; box-shadow: 0 2px 8px rgba(255,213,0,.5); }
      .carre:disabled { background: #ececec; color: #a3a3a3; cursor: not-allowed; }
      .carre .ico { display: flex; align-items: center; justify-content: center; height: 72px; }
      .carre .nom { font-weight: 700; font-size: 16px; }
      .carre .info { font-size: 12px; color: #737373; }
      .panel { background: #fff; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 16px; margin-bottom: 16px; border: 3px solid #FFD500; }
      .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn-gros { padding: 28px 8px; border-radius: 16px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: transform .05s; letter-spacing: 1px; }
      .btn-gros:active { transform: scale(.95); }
      .btn-gros .sous { font-size: 13px; font-weight: 400; margin-top: 4px; letter-spacing: 0; }
      .jaune { background: #FFD500; color: #0a0a0a; border: none; }
      .blanc { background: #fff; color: #0a0a0a; border: 2px solid #0a0a0a; }
      h2 { font-size: 16px; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 1.5px; }
      .bloc { background: #fff; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden; margin-bottom: 16px; }
      .bloc h3 { margin: 0; padding: 12px 16px; border-bottom: 1px solid #e5e5e5; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
      .bloc ul { list-style: none; margin: 0; padding: 0; max-height: 380px; overflow-y: auto; }
      .bloc li { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #f4f4f2; font-size: 14px; }
      .bloc li .heure { font-size: 11px; color: #a3a3a3; }
      .pos { color: #059669; font-weight: 700; } .neg { color: #dc2626; font-weight: 700; } .nul { color: #a3a3a3; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
      .stat { background: #fff; border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      .stat .l { font-size: 10px; text-transform: uppercase; color: #737373; letter-spacing: 1px; }
      .stat .v { font-size: 18px; font-weight: 700; margin: 4px 0 0; }
      .card-ent { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 16px; padding: 16px; }
      .card-ent .l { font-size: 11px; text-transform: uppercase; color: #047857; font-weight: 700; margin: 0; letter-spacing: 1px; }
      .card-ent .v { font-size: 24px; font-weight: 800; color: #047857; margin: 4px 0 0; }
      .card-sor { background: #fef2f2; border: 1px solid #fecaca; border-radius: 16px; padding: 16px; }
      .card-sor .l { font-size: 11px; text-transform: uppercase; color: #b91c1c; font-weight: 700; margin: 0; letter-spacing: 1px; }
      .card-sor .v { font-size: 24px; font-weight: 800; color: #b91c1c; margin: 4px 0 0; }
      .solde { background: #0a0a0a; color: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
      .solde .l { font-size: 11px; text-transform: uppercase; color: #a3a3a3; margin: 0; letter-spacing: 1px; }
      .solde .v { font-size: 24px; font-weight: 800; margin: 4px 0 0; }
      label { font-size: 13px; display: block; }
      input, select { width: 100%; border: 1px solid #d4d4d4; border-radius: 10px; padding: 10px; font-size: 15px; margin-top: 4px; font-family: inherit; background: #fff; }
      input:focus, select:focus { outline: 2px solid #0a0a0a; border-color: #0a0a0a; }
      .btn { width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: .5px; }
      .btn:disabled { background: #d4d4d4; cursor: not-allowed; }
      .btn-noir { background: #FFD500; color: #0a0a0a; } .btn-noir:hover:not(:disabled) { background: #ffdf33; }
      .btn-rouge { background: #dc2626; color: #fff; } .btn-rouge:hover:not(:disabled) { background: #ef4444; }
      .btn-gris { background: #e5e5e5; color: #0a0a0a; } .btn-gris:hover { background: #d4d4d4; }
      .rang { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #f4f4f2; }
      .rang .ico { font-size: 26px; }
      .rang .flex1 { flex: 1; }
      .rang .nom { font-weight: 700; margin: 0; }
      .rang .champs { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
      .rang input { width: 76px; padding: 6px; margin: 0; }
      .rang .tag { padding: 7px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; }
      .tag-visible { background: #FFD500; color: #0a0a0a; }
      .tag-masque { background: #e5e5e5; color: #737373; }
      .tag-supp { background: #fee2e2; color: #dc2626; }
      #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0a0a0a; color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(0,0,0,.3); display: none; }
      table.rap { width: 100%; border-collapse: collapse; font-size: 13px; }
      table.rap th { background: #0a0a0a; color: #FFD500; padding: 8px 6px; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
      table.rap td { padding: 8px 6px; border-bottom: 1px solid #f4f4f2; text-align: center; }
      table.rap td:first-child, table.rap th:first-child { text-align: left; }
      @media print {
        header, nav, .bandeau, #toast, #modal { display: none !important; }
        main > * { display: none; }
        #zone-rapport { display: block !important; }
        body { background: #fff; }
        .bloc, .panel { box-shadow: none; border: 1px solid #ccc; }
      }
      .vide { text-align: center; color: #737373; padding: 24px; font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <div class="marque">
        <svg viewBox="0 0 100 100" aria-label="Fou — Fianchetto du Roi">
          <g fill="#FFD500">
            <circle cx="50" cy="11" r="6"/>
            <path d="M50 20 C61 30 67 43 67 53 C67 65 60 71 50 71 C40 71 33 65 33 53 C33 43 39 30 50 20 Z"/>
            <line x1="42" y1="34" x2="57" y2="52" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
            <path d="M33 72 h34 q8 3 5 8 H28 q-3 -5 5 -8 Z"/>
            <rect x="24" y="82" width="52" height="6" rx="2"/>
          </g>
        </svg>
        <div>
          <h1>Fianchetto du Roi</h1>
          <p class="sous">Buvette — Club d'échecs de Rosporden</p>
        </div>
      </div>
    </header>
    <div class="bandeau"></div>

    <nav>
      <button data-onglet="vente" class="actif">
        <svg viewBox="0 0 48 48"><rect x="6" y="18" width="36" height="20" rx="3" fill="#4CAF50"/><rect x="10" y="10" width="28" height="10" rx="2" fill="#66BB6A"/><rect x="22" y="12" width="12" height="5" rx="1" fill="#0a0a0a"/><circle cx="16" cy="28" r="2" fill="#0a0a0a"/><rect x="8" y="34" width="32" height="9" rx="2" fill="#388E3C"/><rect x="24" y="8" width="9" height="14" rx="1.5" fill="#E8F5E9" transform="rotate(12 28 15)"/></svg>
        VENTE
      </button>
      <button data-onglet="bilan">
        <svg viewBox="0 0 48 48"><rect x="8" y="30" width="7" height="12" rx="1.5" fill="#4FC3F7"/><rect x="19" y="22" width="7" height="20" rx="1.5" fill="#29B6F6"/><rect x="30" y="14" width="7" height="28" rx="1.5" fill="#0288D1"/><path d="M10 26 L22 16 L29 20 L40 8" stroke="#4FC3F7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 8 L40 8 L40 15" stroke="#4FC3F7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        BILAN
      </button>
      <button data-onglet="inventaire">
        <svg viewBox="0 0 48 48"><path d="M8 20 L24 12 L40 20 L40 40 L8 40 Z" fill="#FB8C00"/><path d="M8 20 L24 26 L40 20 L24 12 Z" fill="#FFA726"/><path d="M14 16.5 L34 16.5 M24 12 L24 26" stroke="#E65100" stroke-width="2.5" fill="none"/><rect x="20" y="30" width="8" height="6" rx="1" fill="#FFE0B2"/></svg>
        INVENTAIRE
      </button>
      <button data-onglet="rapports">
        <svg viewBox="0 0 48 48"><path d="M12 4 H36 A2 2 0 0 1 38 6 V42 A2 2 0 0 1 36 44 H12 A2 2 0 0 1 10 42 V6 A2 2 0 0 1 12 4 Z" fill="#ECEFF1"/><rect x="15" y="10" width="18" height="3" rx="1.5" fill="#0a0a0a"/><rect x="15" y="17" width="18" height="3" rx="1.5" fill="#B0BEC5"/><rect x="15" y="24" width="12" height="3" rx="1.5" fill="#B0BEC5"/><circle cx="31" cy="33" r="7" fill="#FFD500" stroke="#0a0a0a" stroke-width="2"/><path d="M31 29.5 V33 L33.5 35" stroke="#0a0a0a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        RAPPORTS
      </button>
      <button data-onglet="admin">
        <svg viewBox="0 0 48 48"><circle cx="16" cy="15" r="7" fill="#9C27B0"/><path d="M5 42 C5 32 10 28 16 28 C22 28 27 32 27 42 Z" fill="#9C27B0"/><g fill="#AB47BC"><path d="M33 24 h5 v3 h2.2 l1.5 2.6 -2.1 2.1 1.5 2.6 -1.5 2.6 h-3.1 v3 h-5 v-3 h-3.1 l-1.5-2.6 1.5-2.6 -1.5-2.6 1.5-2.6 h2.2 Z"/><circle cx="35.5" cy="33" r="2.6" fill="#0a0a0a"/></g></svg>
        ADMIN
      </button>
    </nav>

    <main id="main"></main>

    <!-- Pop-up de sélection produit -->
    <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:50;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)fermerModal()">
      <div style="background:#fff;border-radius:20px;max-width:420px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35);border-top:8px solid #FFD500;text-align:center">
        <button onclick="fermerModal()" style="position:relative;float:right;background:#f4f4f2;border:none;border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer;color:#525252">✕</button>
        <div id="modal-icone" style="font-size:56px;margin:6px 0 2px;display:flex;align-items:center;justify-content:center;min-height:60px">☕</div>
        <h2 id="modal-nom" style="margin:0;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:1px">Café</h2>
        <p id="modal-prix" style="margin:4px 0 18px;font-size:18px;font-weight:700;color:#525252">0,50 €</p>
        <div id="m-choix" style="display:none;max-height:260px;overflow-y:auto;text-align:left"></div>
        <div id="m-actions" style="display:block">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <button id="m-payant" class="btn-gros jaune" style="padding:20px 8px;font-size:16px">💶 Payant<span class="sous" id="m-sous-prix">0,50 €</span></button>
            <button id="m-gratuit" class="btn-gros blanc" style="padding:20px 8px;font-size:16px">🎁 Gratuit<span class="sous">0,00 €</span></button>
          </div>
          <button id="m-cmd" class="btn btn-noir" style="margin-top:10px">➕ Ajouter à la commande</button>
        </div>
      </div>
    </div>

    <!-- Pop-up galerie d'icônes -->
    <div id="icone-modal" style="display:none;position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:60;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)fermerIcones()">
      <div style="background:#fff;border-radius:20px;max-width:560px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.35);border-top:8px solid #FFD500">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <p style="margin:0;font-weight:800;font-size:16px" id="icone-titre">Choisir une icône</p>
          <button onclick="fermerIcones()" style="background:#f4f4f2;border:none;border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer;color:#525252">✕</button>
        </div>
        <p style="margin:0 0 12px;font-size:12px;color:#737373" id="icone-aide">Si une image n'apparaît pas ici, vérifie qu'elle est bien dans le dossier icone/ à côté du fichier de l'app, puis recharge la page.</p>
        <div id="icone-grille" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;max-height:330px;overflow-y:auto"></div>
        <button class="btn btn-gris" style="margin-top:14px" onclick="fermerIcones(null)">Retirer l'icône (revenir à l'emoji)</button>
      </div>
    </div>

    <!-- Pop-up de confirmation (remplace confirm(), bloqué dans certains navigateurs/aperçus) -->
    <div id="confirm-modal" style="display:none;position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:60;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)fermerConfirm()">
      <div style="background:#fff;border-radius:20px;max-width:400px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35);border-top:8px solid #dc2626;text-align:center">
        <p style="font-size:38px;margin:0">❓</p>
        <p id="confirm-msg" style="font-size:16px;font-weight:600;margin:10px 0 18px">Confirmer ?</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button id="confirm-non" style="padding:14px;border-radius:14px;border:2px solid #0a0a0a;background:#fff;color:#0a0a0a;font-size:15px;font-weight:700;cursor:pointer">✕ Non</button>
          <button id="confirm-oui" style="padding:14px;border-radius:14px;border:none;background:#0a0a0a;color:#FFD500;font-size:15px;font-weight:800;cursor:pointer">✓ Oui</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      var CLE = "buvette-echecs-v1";
      var PRODUITS_DEFAUT = [
        { id: "cafe", nom: "Café", icone: "☕", iconeFichier: "cafe.png", prix: 0.5, stock: 50, actif: true, variantes: [] },
        { id: "snack", nom: "Snack", icone: "🍫", iconeFichier: "snack.png", prix: 1.0, stock: 30, actif: true, variantes: [
          { id: "sn1", nom: "Mars", prix: 1.0, stock: 10, iconeFichier: "mars.png" },
          { id: "sn2", nom: "Snickers", prix: 1.0, stock: 10 },
          { id: "sn3", nom: "Twix", prix: 1.0, stock: 10, iconeFichier: "twix.png" },
          { id: "sn4", nom: "Kit Kat", prix: 1.0, stock: 10, iconeFichier: "kit_kat.png" }
        ] },
        { id: "gateau", nom: "Gâteau", icone: "🍰", iconeFichier: "gateau.png", prix: 1.0, stock: 20, actif: true, variantes: [] },
        { id: "crepe", nom: "Crêpe", icone: "🥞", iconeFichier: "crepe_sucre.png", prix: 1.5, stock: 20, actif: true, variantes: [
          { id: "cr1", nom: "Sucre", prix: 1.0, stock: 10, iconeFichier: "crepe_sucre.png" },
          { id: "cr2", nom: "Nutella", prix: 1.5, stock: 10, iconeFichier: "crepe_nutella.png" }
        ] },
        { id: "eau", nom: "Eau", icone: "💧", iconeFichier: "eau.png", prix: 0.5, stock: 40, actif: true, variantes: [] },
        { id: "jus", nom: "Jus d'orange", icone: "🧃", iconeFichier: "jus_orange.png", prix: 1.0, stock: 25, actif: true, variantes: [] },
        { id: "soda", nom: "Soda", icone: "🥤", iconeFichier: "coca.png", prix: 1.5, stock: 30, actif: true, variantes: [
          { id: "so1", nom: "Coca-Cola", prix: 1.5, stock: 10, iconeFichier: "coca.png" },
          { id: "so2", nom: "Fanta", prix: 1.5, stock: 10, iconeFichier: "fanta.png" },
          { id: "so3", nom: "Ice Tea", prix: 1.5, stock: 10, iconeFichier: "ice_tea.png" },
          { id: "so4", nom: "Oasis", prix: 1.5, stock: 10, iconeFichier: "oasis.png" }
        ] },
        { id: "chips", nom: "Chips", icone: "🍟", iconeFichier: "chips.png", prix: 1.0, stock: 20, actif: true, variantes: [] },
        { id: "sandwich", nom: "Sandwich", icone: "🥪", iconeFichier: null, prix: 2.5, stock: 15, actif: true, variantes: [
          { id: "s1", nom: "Jambon beurre", prix: 2.5, stock: 5, iconeFichier: "jambon_beurre.png" },
          { id: "s2", nom: "Jambon emmental", prix: 3.0, stock: 4, iconeFichier: "jambon_emmental.png" },
          { id: "s3", nom: "Complet jambon", prix: 3.5, stock: 3, iconeFichier: "complet_jambon.png" },
          { id: "s4", nom: "Complet poulet", prix: 3.5, stock: 3, iconeFichier: "complet_poulet.png" }
        ] }
      ];

      var etat = charger();
      var onglet = "vente";
      var selection = null;
      var achatSel = "";
      var commande = []; // [{ produitId, qte }]
      var rapportVu = null; // id du rapport affiché
      var toastTimer = null;

      function charger() {
        try {
          var brut = localStorage.getItem(CLE);
          if (brut) {
            var d = JSON.parse(brut);
            if (!d.bilans) d.bilans = [];
            return d;
          }
        } catch (e) {}
        return { produits: PRODUITS_DEFAUT, mouvements: [], caisse: 0, bilans: [] };
      }
      function sauver() {
        try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
      }
      function euro(n) {
        return n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
      }
      function nouvelId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }
      function iconeAff(p, taille) {
        var t = taille || 42;
        if (p.iconeFichier) {
          return '<img src="icone/' + esc(p.iconeFichier) + '" alt="' + esc(p.nom) + '" style="height:' + t + 'px;max-width:70px;object-fit:contain" onerror="this.replaceWith(document.createTextNode(\'' + (p.icone || "🥤") + '\'))">';
        }
        return '<span style="font-size:' + t + 'px">' + p.icone + '</span>';
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function flash(msg) {
        var t = document.getElementById("toast");
        t.textContent = msg;
        t.style.display = "block";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.style.display = "none"; }, 1800);
      }

      function enregistrerVente(p, payant, variante) {
        var nomAff = variante ? p.nom + " (" + variante.nom + ")" : p.nom;
        var prix = variante ? variante.prix : p.prix;
        var stockRef = variante || p;
        etat.mouvements.unshift({
          id: nouvelId(), date: new Date().toISOString(),
          type: payant ? "vente" : "gratuit",
          produitId: p.id, varianteId: variante ? variante.id : null,
          produitNom: nomAff, quantite: 1, montant: payant ? prix : 0
        });
        stockRef.stock = Math.max(0, stockRef.stock - 1);
        if (payant) etat.caisse += prix;
        sauver();
        flash(p.icone + " " + nomAff + (payant ? " enregistré — " + euro(prix) : " offert (gratuit)"));
        selection = null;
        rendre();
      }

      function enregistrerAchat(p, qte, montant) {
        etat.mouvements.unshift({
          id: nouvelId(), date: new Date().toISOString(),
          type: "achat", produitId: p.id, produitNom: p.nom,
          quantite: qte, montant: -montant
        });
        p.stock += qte;
        etat.caisse -= montant;
        achatSel = "";
        sauver();
        flash("📦 " + qte + " × " + p.nom + " ajoutés au stock (−" + euro(montant) + ")");
        rendre();
      }

      function enregistrerSortie(libelle, montant) {
        etat.mouvements.unshift({
          id: nouvelId(), date: new Date().toISOString(),
          type: "sortie", produitId: null, produitNom: libelle,
          quantite: 1, montant: -montant
        });
        etat.caisse -= montant;
        sauver();
        flash("Sortie enregistrée : " + libelle + " (−" + euro(montant) + ")");
        rendre();
      }

      function annulerMouvement(id) {
        var m = etat.mouvements.find(function (x) { return x.id === id; });
        if (!m) return;
        var p = m.produitId ? etat.produits.find(function (x) { return x.id === m.produitId; }) : null;
        if (m.type === "vente" || m.type === "gratuit") {
          if (p) p.stock += m.quantite;
          if (m.montant > 0) etat.caisse -= m.montant;
        } else if (m.type === "achat") {
          if (p) p.stock = Math.max(0, p.stock - m.quantite);
          etat.caisse += Math.abs(m.montant);
        } else if (m.type === "sortie") {
          etat.caisse += Math.abs(m.montant);
        }
        etat.mouvements = etat.mouvements.filter(function (x) { return x.id !== id; });
        sauver();
        flash("↩️ Mouvement annulé : " + m.produitNom);
        rendre();
      }

      function enregistrerCommande(payant) {
        var total = 0;
        var nbArticles = 0;
        commande.forEach(function (l) {
          var p = etat.produits.find(function (x) { return x.id === l.produitId; });
          if (!p) return;
          var variante = l.varianteId ? (p.variantes || []).find(function (v) { return v.id === l.varianteId; }) : null;
          var nomAff = variante ? p.nom + " (" + variante.nom + ")" : p.nom;
          var prixUnit = variante ? variante.prix : p.prix;
          var stockRef = variante || p;
          etat.mouvements.unshift({
            id: nouvelId(), date: new Date().toISOString(),
            type: payant ? "vente" : "gratuit",
            produitId: p.id, varianteId: l.varianteId || null,
            produitNom: nomAff, quantite: l.qte, montant: payant ? prixUnit * l.qte : 0
          });
          stockRef.stock = Math.max(0, stockRef.stock - l.qte);
          if (payant) { total += prixUnit * l.qte; etat.caisse += prixUnit * l.qte; }
          nbArticles += l.qte;
        });
        commande = [];
        sauver();
        flash("🧾 Commande de " + nbArticles + " article(s) " + (payant ? "encaissée — " + euro(total) : "offerte (gratuit)"));
        rendre();
      }

      function annulerMouvement(id) {
        var m = etat.mouvements.find(function (x) { return x.id === id; });
        if (!m) return;
        var p = m.produitId ? etat.produits.find(function (x) { return x.id === m.produitId; }) : null;
        var variante = null;
        if (p && m.varianteId && p.variantes) {
          variante = p.variantes.find(function (v) { return v.id === m.varianteId; });
        }
        var stockRef = variante || p;
        if (m.type === "vente" || m.type === "gratuit") {
          if (stockRef) stockRef.stock += m.quantite;
          if (m.montant > 0) etat.caisse -= m.montant;
        } else if (m.type === "achat") {
          if (stockRef) stockRef.stock = Math.max(0, stockRef.stock - m.quantite);
          etat.caisse += Math.abs(m.montant);
        } else if (m.type === "sortie") {

      // ---------- Rapports ----------

      function construireRapport() {
        var mvs = etat.mouvements;
        var ventes = mvs.filter(function (m) { return m.type === "vente"; });
        var gratuits = mvs.filter(function (m) { return m.type === "gratuit"; });
        var achats = mvs.filter(function (m) { return m.type === "achat"; });
        var sorties = mvs.filter(function (m) { return m.type === "sortie"; });
        var parProduit = etat.produits.map(function (p) {
          var vPay = mvs.filter(function (m) { return m.produitId === p.id && m.type === "vente"; });
          var vGra = mvs.filter(function (m) { return m.produitId === p.id && m.type === "gratuit"; });
          var achat = mvs.filter(function (m) { return m.produitId === p.id && m.type === "achat"; });
          return {
            nom: p.nom, icone: p.icone, prix: p.prix,
            vendusPayants: vPay.reduce(function (s, m) { return s + m.quantite; }, 0),
            offerts: vGra.reduce(function (s, m) { return s + m.quantite; }, 0),
            recette: vPay.reduce(function (s, m) { return s + m.montant; }, 0),
            achetes: achat.reduce(function (s, m) { return s + m.quantite; }, 0),
            coutAchats: achat.reduce(function (s, m) { return s + Math.abs(m.montant); }, 0),
            stockFin: p.stock
          };
        });
        // Détail par variante (sous-préparations : Jambon beurre, Mars, etc.)
        var parVariante = [];
        etat.produits.forEach(function (p) {
          (p.variantes || []).forEach(function (v) {
            var vPay = mvs.filter(function (m) { return m.varianteId === v.id && m.type === "vente"; });
            var vGra = mvs.filter(function (m) { return m.varianteId === v.id && m.type === "gratuit"; });
            if (vPay.length + vGra.length === 0) return; // seulement celles vendues
            parVariante.push({
              produit: p.nom, nom: v.nom, prix: v.prix,
              vendusPayants: vPay.reduce(function (s, m) { return s + m.quantite; }, 0),
              offerts: vGra.reduce(function (s, m) { return s + m.quantite; }, 0),
              recette: vPay.reduce(function (s, m) { return s + m.montant; }, 0),
              stockFin: v.stock
            });
          });
        });
        // Répartition horaire des ventes
        var horaires = {};
        mvs.forEach(function (m) {
          if (m.type !== "vente" && m.type !== "gratuit") return;
          var h = new Date(m.date).getHours();
          if (!horaires[h]) horaires[h] = { ventes: 0, gratuits: 0, montant: 0 };
          horaires[h].ventes += m.type === "vente" ? m.quantite : 0;
          horaires[h].gratuits += m.type === "gratuit" ? m.quantite : 0;
          horaires[h].montant += m.montant;
        });
        // Top vente du jour
        var top = null;
        parProduit.forEach(function (p) {
          var score = p.vendusPayants + p.offerts;
          if (!top || score > top.score) top = { nom: p.nom, score: score, recette: p.recette };
        });
        var totalEntrees = ventes.reduce(function (s, m) { return s + m.montant; }, 0);
        var totalAchats = achats.reduce(function (s, m) { return s + Math.abs(m.montant); }, 0);
        var totalSorties = sorties.reduce(function (s, m) { return s + Math.abs(m.montant); }, 0);
        return {
          id: nouvelId(),
          dateCloture: new Date().toISOString(),
          mouvements: JSON.parse(JSON.stringify(mvs)),
          resume: {
            totalEntrees: totalEntrees,
            totalAchats: totalAchats,
            totalSorties: totalSorties,
            solde: totalEntrees - totalAchats - totalSorties,
            caisseFin: etat.caisse,
            nbVentes: ventes.reduce(function (s, m) { return s + m.quantite; }, 0),
            nbGratuits: gratuits.reduce(function (s, m) { return s + m.quantite; }, 0),
            nbAchats: achats.length,
            nbSorties: sorties.length,
            parProduit: parProduit,
            parVariante: parVariante,
            horaires: horaires,
            top: top
          }
        };
      }

      function svgBarres(items) {
        var max = 1;
        items.forEach(function (i) { if (i.recette > max) max = i.recette; });
        var h = items.length * 32 + 8;
        var s = '<svg viewBox="0 0 400 ' + h + '" style="width:100%;height:auto">';
        items.forEach(function (it, i) {
          var y = i * 32 + 4;
          var w = (it.recette / max) * 250;
          s += '<text x="0" y="' + (y + 16) + '" font-size="13" fill="#0a0a0a">' + it.icone + " " + esc(it.nom) + '</text>';
          s += '<rect x="120" y="' + y + '" width="' + Math.max(2, w) + '" height="24" rx="4" fill="#FFD500" stroke="#0a0a0a"/>';
          s += '<text x="' + (126 + Math.max(2, w)) + '" y="' + (y + 17) + '" font-size="12" font-weight="bold" fill="#0a0a0a">' + euro(it.recette) + '</text>';
        });
        return s + '</svg>';
      }

        var ligne = commande.find(function (l) { return l.cle === cle; });
        if (ligne) ligne.qte += 1;
        else commande.push({ cle: cle, produitId: selection.id, varianteId: modalVariante ? modalVariante.id : null, qte: 1 });
        flash(selection.icone + " " + selection.nom + (modalVariante ? " (" + modalVariante.nom + ")" : "") + " ajouté à la commande");
        fermerModal();
        rendre();
      });

      // ---------- Rendu ----------

      function rendre() {
        var mvs = etat.mouvements;
        var ventes = mvs.filter(function (m) { return m.type === "vente"; });
        var gratuits = mvs.filter(function (m) { return m.type === "gratuit"; });
        var achats = mvs.filter(function (m) { return m.type === "achat"; });
        var sorties = mvs.filter(function (m) { return m.type === "sortie"; });
        var totalEntrees = ventes.reduce(function (s, m) { return s + m.montant; }, 0);
        var totalAchats = achats.reduce(function (s, m) { return s + Math.abs(m.montant); }, 0);
        var totalSorties = sorties.reduce(function (s, m) { return s + Math.abs(m.montant); }, 0);

        var main = document.getElementById("main");
        var html = "";

        // ---- Page VENTE : aucun montant global visible ----
        if (onglet === "vente") {
          // Mode commande : panier multi-produits
          var totalCmd = 0;
          commande.forEach(function (l) {
            var pp = etat.produits.find(function (x) { return x.id === l.produitId; });
            if (pp) {
              var pv = l.varianteId ? (pp.variantes || []).find(function (v) { return v.id === l.varianteId; }) : null;
              totalCmd += (pv ? pv.prix : pp.prix) * l.qte;
            }
          });
          html += '<div class="panel" style="border:3px solid #FFD500;margin-bottom:12px">' +
            '<p style="margin:0 0 10px;font-weight:800;font-size:16px">🧾 Commande</p>';
          if (commande.length === 0) {
            html += '<p style="margin:0;color:#737373;font-size:14px">Sélectionne plusieurs produits ci-dessous, puis valide tout d\'un coup. Le total s\'additionne ici.</p>';
          } else {
            html += '<ul style="list-style:none;margin:0;padding:0">';
            commande.forEach(function (l, i) {
              var pp = etat.produits.find(function (x) { return x.id === l.produitId; });
              if (!pp) return;
              html += '<li style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f4f4f2;font-size:14px">' +
              '<span><b>' + iconeAff(pp, 22) + " " + esc(pp.nom) + '</b> ×' + l.qte + " — " + euro(((l.varianteId ? (pp.variantes.find(function (v) { return v.id === l.varianteId; }) || {}).prix : pp.prix) || pp.prix) * l.qte) + '</span>' +
                '<button data-retirer="' + i + '" style="background:#fee2e2;color:#dc2626;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer">✕ Retirer</button></li>';
            });
            html += '</ul>' +
              '<p style="text-align:right;font-weight:800;font-size:19px;margin:12px 0 0">Total : ' + euro(totalCmd) + '</p>' +
              '<div class="deux" style="margin-top:12px">' +
              '<button class="btn-gros jaune" style="padding:18px 8px;font-size:16px" data-act="cmd-paye">💶 Payé<span class="sous">' + euro(totalCmd) + '</span></button>' +
              '<button class="btn-gros blanc" style="padding:18px 8px;font-size:16px" data-act="cmd-gratuit">🎁 Gratuit<span class="sous">tout offert</span></button></div>' +
              '<button class="btn btn-gris" style="margin-top:10px" data-act="cmd-vider">🗑️ Vider la commande</button>';
          }
          html += '</div>';

          var actifs = etat.produits.filter(function (p) { return p.actif; });
          html += '<div class="grille">';
          if (actifs.length === 0) {
            html += '<p class="vide" style="grid-column:1/-1">Aucun produit actif. Ajoutez-en dans l\'onglet ⚙️ Admin.</p>';
          }
          actifs.forEach(function (p) {
            var nbVar = p.variantes && p.variantes.length > 0;
            var stockTotal = nbVar ? p.variantes.reduce(function (s, v) { return s + v.stock; }, 0) : p.stock;
            var stockDisp = nbVar ? p.variantes.every(function (v) { return v.stock <= 0; }) : p.stock <= 0;
            html += '<button class="carre" data-produit="' + p.id + '"' + (stockDisp ? " disabled" : "") + '>' +
              '<span class="ico" style="display:flex;align-items:center;justify-content:center;height:72px">' + iconeAff(p, 68) + '</span><span class="nom">' + esc(p.nom) + (nbVar ? ' <span style="font-size:10px;background:#FFD500;border-radius:6px;padding:1px 6px;color:#0a0a0a">' + p.variantes.length + '</span>' : "") + '</span>' +
              '<span class="info">' + (nbVar ? stockTotal + " restants" : euro(p.prix) + " · " + p.stock + " restants") + (nbVar ? " · plusieurs choix" : "") + '</span></button>';
          });
          html += '</div>';
        }

        // ---- Page BILAN : tous les montants ici ----
        if (onglet === "bilan") {
          var solde = totalEntrees - totalAchats - totalSorties;
          html += '<div class="stats">' +
            '<div class="stat"><p class="l">Recettes du jour</p><p class="v" style="color:#047857">' + euro(totalEntrees) + '</p></div>' +
            '<div class="stat"><p class="l">Ventes payantes</p><p class="v">' + ventes.length + '</p></div>' +
            '<div class="stat"><p class="l">Offerts</p><p class="v">' + gratuits.length + '</p></div></div>';

          html += '<div class="deux" style="margin-bottom:12px">' +
            '<div class="card-ent"><p class="l">Entrées (ventes)</p><p class="v">+' + euro(totalEntrees) + '</p></div>' +
            '<div class="card-sor"><p class="l">Sorties (achats + dépenses)</p><p class="v">−' + euro(totalAchats + totalSorties) + '</p></div></div>';
          html += '<div class="solde"><div><p class="l">Solde de la journée</p>' +
            '<p class="v" style="color:' + (solde >= 0 ? "#4ade80" : "#f87171") + '">' + (solde >= 0 ? "+" : "") + euro(solde) + '</p></div>' +
            '<div style="text-align:right"><p class="l">En caisse</p><p style="font-weight:700;margin:4px 0 0">' + euro(etat.caisse) + '</p></div></div>';

          html += '<div class="bloc"><h3>Historique des mouvements</h3>';
          if (mvs.length === 0) {
            html += '<p class="vide">Aucun mouvement aujourd\'hui.</p>';
          } else {
            html += '<ul>';
            mvs.forEach(function (m) {
              var ic = m.type === "vente" ? "💰" : m.type === "gratuit" ? "🎁" : m.type === "achat" ? "📦" : "💸";
              var cls = m.montant > 0 ? "pos" : m.montant < 0 ? "neg" : "nul";
              var heure = new Date(m.date).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
              html += '<li><div><b>' + ic + " " + esc(m.produitNom) + "</b>" +
                (m.quantite > 1 ? ' <span style="color:#737373">×' + m.quantite + "</span>" : "") +
                '<p class="heure">' + heure + '</p></div>' +
                '<div style="display:flex;align-items:center;gap:8px">' +
                '<span class="' + cls + '">' + (m.montant > 0 ? "+" : "") + euro(m.montant) + '</span>' +
                '<button data-annuler-mvt="' + m.id + '" style="background:#fee2e2;color:#dc2626;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer">↩️ Annuler</button>' +
                '</div></li>';
            });
            html += '</ul>';
          }
          html += '</div>';
          html += '<button class="btn btn-noir" data-act="cloturer">🌙 Clôturer la journée</button>';
        }

        if (onglet === "inventaire") {
          html += '<h2>📦 Stock restant</h2><div class="bloc">';
          etat.produits.forEach(function (pr) {
            var vendus = mvs.filter(function (m) {
              return m.produitId === pr.id && (m.type === "vente" || m.type === "gratuit");
            }).reduce(function (s, m) { return s + m.quantite; }, 0);
            var stockTot = pr.variantes && pr.variantes.length ? pr.variantes.reduce(function (s, v) { return s + v.stock; }, 0) : pr.stock;
            html += '<div class="rang"><span class="ico" style="display:flex;align-items:center;justify-content:center;height:26px">' + iconeAff(pr, 26) + '</span>' +
              '<div class="flex1"><p class="nom">' + esc(pr.nom) + '</p>' +
              '<p style="font-size:13px;color:#525252;margin:4px 0 0">Vendus aujourd\'hui : <b>' + vendus + '</b> · Restants : <b>' + stockTot + '</b></p>';
            if (pr.variantes && pr.variantes.length) {
              pr.variantes.forEach(function (v) {
                html += '<p style="font-size:12px;color:#737373;margin:2px 0 0">' + esc(v.nom) + ' : <b>' + v.stock + '</b> restants</p>';
              });
            }
            html += '</div></div>';
          });
          html += '</div>';

          html += '<h2>🛍️ Enregistrer un achat (réapprovisionnement)</h2><div class="panel" style="border:2px solid #e5e5e5">';
          html += '<label>Produit<select id="sel-achat"><option value="">— Choisir un produit —</option>';
          etat.produits.forEach(function (pr) {
            html += '<option value="' + pr.id + '"' + (achatSel === pr.id ? " selected" : "") + '>' + pr.icone + " " + esc(pr.nom) + '</option>';
          });
          html += '</select></label>';
          if (achatSel) {
            html += '<div class="deux" style="margin-top:10px">' +
              '<label>Quantité achetée<input type="number" id="inp-qte" min="1" value="1"></label>' +
              '<label>Somme payée (€)<input type="number" id="inp-montant" min="0" step="0.01" value="0"></label></div>';
          }
          html += '<button class="btn btn-noir" style="margin-top:12px" data-act="achat"' + (!achatSel ? " disabled" : "") + '>Ajouter au stock</button></div>';

          html += '<h2>💸 Dépense libre (sortie de caisse)</h2><div class="panel" style="border:2px solid #e5e5e5">';
          html += '<label>Libellé (ex : course, remboursement…)<input type="text" id="inp-libelle" placeholder="Ex : courses supermarché"></label>' +
            '<label style="margin-top:10px">Montant (€)<input type="number" id="inp-montant-sortie" min="0" step="0.01" value="0"></label>' +
            '<button class="btn btn-rouge" style="margin-top:12px" data-act="sortie">Enregistrer la sortie</button></div>';
        }

        if (onglet === "admin") {
          html += '<h2>➕ Nouveau produit</h2><div class="panel" style="border:2px solid #e5e5e5">' +
            '<div class="deux" style="grid-template-columns:2fr 1fr">' +
            '<label>Nom<input type="text" id="ad-nom" placeholder="Ex : Chocolat chaud"></label>' +
            '<label>Emoji<input type="text" id="ad-icone" value="🥤" style="text-align:center;font-size:18px"></label></div>' +
            '<label style="margin-top:10px">Fichier d\'icône (optionnel, ex : cafe.png dans le dossier icone/)<input type="text" id="ad-fichier" placeholder="cafe.png"></label>' +
            '<div class="deux" style="margin-top:10px">' +
            '<label>Prix de vente (€)<input type="number" id="ad-prix" min="0" step="0.05" value="1"></label>' +
            '<label>Stock initial<input type="number" id="ad-stock" min="0" value="0"></label></div>' +
            '<button class="btn btn-noir" style="margin-top:12px" data-act="ajouter-produit">Ajouter le produit</button></div>';

          html += '<h2>📋 Produits configurés</h2><div class="bloc">';
          etat.produits.forEach(function (pr) {
            html += '<div class="rang"><span class="ico" style="display:flex;align-items:center;justify-content:center;height:26px">' + iconeAff(pr, 26) + '</span><div class="flex1">' +
              '<p class="nom">' + esc(pr.nom) + '</p>' +
              '<button class="tag" style="background:#FFD500;color:#0a0a0a" data-choisir-ico="' + pr.id + '">🖼️ ' + (pr.iconeFichier ? esc(pr.iconeFichier) : "Choisir l'icône") + '</button>';
            if (pr.variantes && pr.variantes.length > 0) {
              html += '<p style="font-size:12px;color:#525252;margin:6px 0;font-weight:700">Variantes :</p>';
              pr.variantes.forEach(function (v) {
                html += '<div class="champs" style="margin-bottom:4px">' +
                  '<input type="text" value="' + esc(v.nom) + '" data-vnom="' + pr.id + "|" + v.id + '" style="width:130px">' +
                  '<input type="number" min="0" step="0.05" value="' + v.prix + '" data-vprix="' + pr.id + "|" + v.id + '"> €' +
                  '<input type="number" min="0" value="' + v.stock + '" data-vstock="' + pr.id + "|" + v.id + '"> stock' +
                  '<button class="tag" style="background:#f4f4f2;color:#0a0a0a" data-choisir-vico="' + pr.id + "|" + v.id + '">🖼️ ' + (v.iconeFichier ? esc(v.iconeFichier) : "Icône") + '</button>' +
                  '<button class="tag tag-supp" data-vsupp="' + pr.id + "|" + v.id + '">✕</button></div>';
              });
            } else {
              html += '<div class="champs">' +
                '<input type="number" min="0" step="0.05" value="' + pr.prix + '" data-prix="' + pr.id + '"> €' +
                '<input type="number" min="0" value="' + pr.stock + '" data-stock="' + pr.id + '"> en stock</div>';
            }
            html += '</div>' +
              '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">' +
              '<button class="tag" style="background:#f4f4f2;color:#0a0a0a" data-add-var="' + pr.id + '">➕ Variante</button>' +
              '<button class="tag ' + (pr.actif ? "tag-visible" : "tag-masque") + '" data-toggle="' + pr.id + '">' + (pr.actif ? "Visible" : "Masqué") + '</button>' +
              '<button class="tag tag-supp" data-supp="' + pr.id + '">Supprimer</button></div></div>';
          });
          html += '</div>';
          html += '<button class="btn btn-gris" data-act="reset-all">♻️ Réinitialiser toute l\'application</button>';
        }

        // ---- Page RAPPORTS : archives des journées clôturées ----
        if (onglet === "rapports") {
          if (rapportVu) {
            var r = etat.bilans.find(function (b) { return b.id === rapportVu; });
            if (r) html += htmlRapportDetail(r);
            else { rapportVu = null; }
          }
          if (!rapportVu) {
            html += '<h2>📁 Rapports de journées</h2><div class="bloc">';
            if (!etat.bilans || etat.bilans.length === 0) {
              html += '<p class="vide">Aucun rapport. Clôture une journée dans l\'onglet 📊 Bilan : le rapport complet sera archivé ici (et conservé même après remise à zéro).</p>';
            } else {
              html += '<ul>';
              etat.bilans.slice().reverse().forEach(function (b) {
                var d = new Date(b.dateCloture);
                var j = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
                var so = b.resume.solde;
                html += '<li><div><b>' + j + '</b>' +
                  '<p class="heure">Clôturé à ' + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) +
                  ' · ' + b.mouvements.length + ' mouvements · Recettes ' + euro(b.resume.totalEntrees) + '</p></div>' +
                  '<div style="display:flex;align-items:center;gap:8px">' +
                  '<span class="' + (so >= 0 ? "pos" : "neg") + '">' + (so >= 0 ? "+" : "") + euro(so) + '</span>' +
                  '<button data-voir-rapport="' + b.id + '" style="background:#FFD500;color:#0a0a0a;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">👁️ Voir</button>' +
                  '<button data-supp-rapport="' + b.id + '" style="background:#fee2e2;color:#dc2626;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">🗑️</button>' +
                  '</div></li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          }
        }

        main.innerHTML = html;
        document.querySelectorAll("nav button").forEach(function (b) {
          b.classList.toggle("actif", b.dataset.onglet === onglet);
        });
      }

      // ---------- Événements ----------

      document.querySelector("nav").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        onglet = b.dataset.onglet;
        selection = null;
        rapportVu = null;
        rendre();
      });

      document.getElementById("main").addEventListener("click", function (e) {
        var el = e.target.closest("[data-produit],[data-act],[data-toggle],[data-supp],[data-retirer],[data-annuler-mvt],[data-voir-rapport],[data-supp-rapport],[data-add-var],[data-vsupp],[data-choisir-ico],[data-choisir-vico]");
        if (!el) return;

        if (el.dataset.voirRapport) { rapportVu = el.dataset.voirRapport; rendre(); return; }
        if (el.dataset.suppRapport) {
          var idSupp = el.dataset.suppRapport;
          demanderConfirmation("Supprimer définitivement ce rapport archivé ?", function () {
            etat.bilans = etat.bilans.filter(function (b) { return b.id !== idSupp; });
            if (rapportVu === idSupp) rapportVu = null;
            sauver(); flash("Rapport supprimé"); rendre();
          });
          return;
        }

        if (el.dataset.retirer !== undefined) {
          commande.splice(Number(el.dataset.retirer), 1);
          rendre();
          return;
        }
        if (el.dataset.annulerMvt) {
          annulerMouvement(el.dataset.annulerMvt);
          return;
        }
        if (el.dataset.addVar) {
          var pa = etat.produits.find(function (x) { return x.id === el.dataset.addVar; });
          if (pa) {
            var nouveauNom = "Variante " + (((pa.variantes || []).length) + 1);
            pa.variantes = pa.variantes || [];
            pa.variantes.push({ id: nouvelId(), nom: nouveauNom, prix: pa.prix, stock: 0 });
            sauver(); rendre();
          }
          return;
        }
        if (el.dataset.vsupp) {
          var ids = el.dataset.vsupp.split("|");
          var pv = etat.produits.find(function (x) { return x.id === ids[0]; });
          if (pv && pv.variantes) {
            pv.variantes = pv.variantes.filter(function (v) { return v.id !== ids[1]; });
            sauver(); rendre();
          }
          return;
        }
        if (el.dataset.choisirIco) {
          var pi = etat.produits.find(function (x) { return x.id === el.dataset.choisirIco; });
          if (pi) ouvrirIcones("Icône — " + pi.nom, { type: "produit", produitId: pi.id }, pi.iconeFichier);
          return;
        }
        if (el.dataset.choisirVico) {
          var idsv = el.dataset.choisirVico.split("|");
          var pv2 = etat.produits.find(function (x) { return x.id === idsv[0]; });
          var vv = pv2 && pv2.variantes ? pv2.variantes.find(function (x) { return x.id === idsv[1]; }) : null;
          if (vv) ouvrirIcones("Icône — " + vv.nom, { type: "variante", produitId: pv2.id, varianteId: vv.id }, vv.iconeFichier);
          return;
        }
        if (el.dataset.produit) {
          var p = etat.produits.find(function (x) { return x.id === el.dataset.produit; });
          if (p) ouvrirModal(p);
          return;
        }
        var act = el.dataset.act;
        if (act === "cmd-paye" && commande.length) enregistrerCommande(true);
        if (act === "cmd-gratuit" && commande.length) enregistrerCommande(false);
        if (act === "cmd-vider") { commande = []; rendre(); }
        if (act === "retour-rapports") { rapportVu = null; rendre(); }
        if (act === "imprimer") { window.print(); }
        if (act === "cloturer") {
          demanderConfirmation("Clôturer la journée ? Un rapport complet sera archivé dans l'onglet 📁 Rapports, puis le bilan sera remis à zéro (produits et stock conservés).", function () {
            if (etat.mouvements.length > 0) {
              var rapport = construireRapport();
              etat.bilans.push(rapport);
              flash("📁 Rapport archivé — visible dans l'onglet Rapports");
            } else {
              flash("Journée clôturée (aucun mouvement à archiver)");
            }
            etat.mouvements = []; etat.caisse = 0; sauver(); rendre();
          });
        }
        if (act === "achat") {
          var pr = etat.produits.find(function (x) { return x.id === achatSel; });
          var q = parseInt(document.getElementById("inp-qte").value) || 1;
          var m = parseFloat(document.getElementById("inp-montant").value) || 0;
          if (pr) enregistrerAchat(pr, Math.max(1, q), Math.max(0, m));
        }
        if (act === "sortie") {
          var lib = (document.getElementById("inp-libelle").value || "").trim();
          var ms = parseFloat(document.getElementById("inp-montant-sortie").value) || 0;
          if (lib && ms > 0) enregistrerSortie(lib, ms);
          else flash("⚠️ Indiquez un libellé et un montant");
        }
        if (act === "ajouter-produit") {
          var nom = (document.getElementById("ad-nom").value || "").trim();
          var icone = document.getElementById("ad-icone").value || "🥤";
          var fichier = (document.getElementById("ad-fichier").value || "").trim() || null;
          var prix = parseFloat(document.getElementById("ad-prix").value) || 0;
          var stock = parseInt(document.getElementById("ad-stock").value) || 0;
          if (!nom) { flash("⚠️ Donne un nom au produit"); return; }
          etat.produits.push({ id: nouvelId(), nom: nom, icone: icone, iconeFichier: fichier, prix: Math.max(0, prix), stock: Math.max(0, stock), actif: true, variantes: [] });
          sauver(); flash(nom + " ajouté ✅"); rendre();
        }
        if (act === "reset-all") {
          demanderConfirmation("Tout réinitialiser ? Produits, mouvements et caisse reviennent aux valeurs de départ (les rapports archivés sont conservés).", function () {
            etat = { produits: JSON.parse(JSON.stringify(PRODUITS_DEFAUT)), mouvements: [], caisse: 0, bilans: etat.bilans };
            sauver(); flash("App réinitialisée"); rendre();
          });
        }
        if (el.dataset.toggle) {
          var t = etat.produits.find(function (x) { return x.id === el.dataset.toggle; });
          if (t) { t.actif = !t.actif; sauver(); rendre(); }
        }
        if (el.dataset.supp) {
          var s = etat.produits.find(function (x) { return x.id === el.dataset.supp; });
          if (s) {
            var nomS = s.nom, idS = s.id;
            demanderConfirmation("Supprimer « " + nomS + " » ?", function () {
              etat.produits = etat.produits.filter(function (x) { return x.id !== idS; });
              sauver(); rendre();
            });
          }
        }
      });

      document.getElementById("main").addEventListener("change", function (e) {
        var t = e.target;
        if (t.id === "sel-achat") { achatSel = t.value; rendre(); }
        if (t.dataset.prix) {
          var p = etat.produits.find(function (x) { return x.id === t.dataset.prix; });
          if (p) { p.prix = Math.max(0, parseFloat(t.value) || 0); sauver(); }
        }
        if (t.dataset.stock) {
          var pr2 = etat.produits.find(function (x) { return x.id === t.dataset.stock; });
          if (pr2) { pr2.stock = Math.max(0, parseInt(t.value) || 0); sauver(); }
        }
        if (t.dataset.fichier) {
          var pf = etat.produits.find(function (x) { return x.id === t.dataset.fichier; });
          if (pf) { pf.iconeFichier = t.value.trim() || null; sauver(); rendre(); }
        }
        if (t.dataset.vnom || t.dataset.vprix || t.dataset.vstock || t.dataset.vfichier) {
          var ids = (t.dataset.vnom || t.dataset.vprix || t.dataset.vstock || t.dataset.vfichier).split("|");
          var prod = etat.produits.find(function (x) { return x.id === ids[0]; });
          var varr = prod && prod.variantes ? prod.variantes.find(function (v) { return v.id === ids[1]; }) : null;
          if (varr) {
            if (t.dataset.vnom) varr.nom = t.value.trim() || varr.nom;
            if (t.dataset.vprix) varr.prix = Math.max(0, parseFloat(t.value) || 0);
            if (t.dataset.vstock) varr.stock = Math.max(0, parseInt(t.value) || 0);
            if (t.dataset.vfichier) varr.iconeFichier = t.value.trim() || null;
            sauver();
          }
        }
      });

      rendre();
    </script>
  </body>
</html>
